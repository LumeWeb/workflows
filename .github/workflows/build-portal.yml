name: Build Portal

on:
  workflow_call:
    inputs:
      build_tags:
        description: 'Go build tags to apply when compiling the portal binary (comma-separated, format: foo,bar).'
        required: false
        type: string
        default: ''
      excludes:
        description: 'Go module exclusion directives (comma-separated, format: module@version).'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build Portal (No Plugins)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
          submodules: true
    - name: Create Plugin Manifest
      run: |
        # Create manifest with portal version and empty plugins array
        yq -n '.portalVersion = "develop" | .plugins = []' > portal-plugins.yaml
        
        # Add build tags if provided
        if [ -n "${{ inputs.build_tags }}" ]; then
          IFS=',' read -ra TAGS <<< "${{ inputs.build_tags }}"
          TAG_INDEX=0
          for tag in "${TAGS[@]}"; do
            tag=$(echo "$tag" | xargs)
            if [ -n "$tag" ]; then
              yq -i ".buildTags[$TAG_INDEX] = \"$tag\"" portal-plugins.yaml
              TAG_INDEX=$((TAG_INDEX + 1))
            fi
          done
        fi
        
        # Add excludes if provided
        if [ -n "${{ inputs.excludes }}" ]; then
          IFS=',' read -ra EXCLS <<< "${{ inputs.excludes }}"
          EXCL_INDEX=0
          for ex in "${EXCLS[@]}"; do
            ex=$(echo "$ex" | xargs)
            if [ -n "$ex" ]; then
              if [[ "$ex" == *@* ]]; then
                MODULE="${ex%@*}"
                VERSION="${ex##*@}"
                yq -i ".excludes[$EXCL_INDEX].module = \"$MODULE\" | .excludes[$EXCL_INDEX].version = \"$VERSION\"" portal-plugins.yaml
                EXCL_INDEX=$((EXCL_INDEX + 1))
              fi
            fi
          done
        fi
        
        echo "Created portal-plugins.yaml (portal-only):"
        cat portal-plugins.yaml
    - name: Generate + Build + Test
      uses: addnab/docker-run-action@v3
      with:
        image: ghcr.io/lumeweb/portal-builder:ubuntu
        options: -v ${{ github.workspace }}:/workspace -v ${{ github.workspace }}/dist:/dist
        shell: bash
        run: |
          set -e
          echo "=== Running go generate ==="
          go generate ./...
          echo "=== Building portal ==="
          build-portal
          echo "=== Running tests ==="
          go test $(go list ./... | grep -v bench_tests)
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: portal-build
        path: dist/portal
        retention-days: 1

  run:
    name: Run Portal (${{ matrix.db_type }})
    needs: build
    strategy:
      matrix:
        db_type: [sqlite, mysql]
    uses: ./.github/workflows/run-portal.yml
    with:
      db_type: ${{ matrix.db_type }}
