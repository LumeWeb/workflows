name: UI Update Workflow

on:
  workflow_call:
    inputs:
      commit_hash:
        description: 'The commit hash to update to'
        required: true
        type: string
      app_name:
        description: 'The name of the app being updated (e.g., portal-frontend)'
        required: false
        type: string
      repository:
        description: 'The source repository (for PR description)'
        required: true
        type: string

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.0'
          cache: true

      - name: Update Go dependency
        run: |
          set -e
          set -o pipefail
          
          commit_hash="${{ inputs.commit_hash }}"

          echo "Finding go.lumeweb.com/web/go/ dependencies..."
          DEPS=$(go list -json -m all | jq -r 'select(.Path | startswith("go.lumeweb.com/web/go/")) | .Path')

          if [ -z "$DEPS" ]; then
            echo "No go.lumeweb.com/web/go/ dependencies found"
            exit 0
          fi

          echo "Found dependencies:"
          echo "$DEPS"

          while IFS= read -r dep; do
            echo "Updating $dep to commit $commit_hash..."

            FULL_PATH="${dep}@${commit_hash}"
            VERSION=$(go list -m -json "$FULL_PATH" | jq -r '.Version')

            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "Error: Could not get version for $FULL_PATH"
              go list -m -json "$FULL_PATH"
              exit 1
            fi

            echo "Pseudo-version: $VERSION"

            REQUIRE_PATH="${dep}@${VERSION}"
            go mod edit -require="$REQUIRE_PATH"

            echo "Updated to: $REQUIRE_PATH"
          done <<< "$DEPS"

          echo "Running go mod tidy..."
          go mod tidy

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT }}
          commit-message: "chore: update UI dependency"
          title: "chore: update UI dependency"
          body: |
            Updates UI dependency to latest changes.

            Source: ${{ inputs.repository }}@${{ inputs.commit_hash }}
          branch: deps/update-ui
          base: develop
          delete-branch: true
          labels: |
            dependencies
            automated pr
