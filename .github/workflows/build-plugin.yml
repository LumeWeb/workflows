name: Build Plugin

on:
  workflow_call:
    inputs:
      additional_dependencies:
        description: 'Additional plugin dependencies to include (comma-separated, format: go.lumeweb.com/plugin-name,go.lumeweb.com/another-plugin)'
        required: false
        type: string
        default: ''
      replacements:
        description: 'Go module replacements (comma-separated, format: old_module@version=new_module@version)'
        required: false
        type: string
        default: ''
      setup_script:
        description: 'Bash script to run inside the container before generate/build/test. Use for installing extra deps (e.g. Kubo, jq).'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build Portal
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
          submodules: true
    - name: Extract Repo Name
      id: repo-name
      run: echo "REPO_NAME=$(echo ${{ github.repository }} | cut -d '/' -f 2)" >> $GITHUB_OUTPUT
    - name: Create Plugin Manifest
      run: |
        # Initialize manifest with portal version and current plugin
        yq -n '
          .portalVersion = "develop" |
          .plugins[0].module = "go.lumeweb.com/${{ steps.repo-name.outputs.REPO_NAME }}" |
          .plugins[0].version = "${{ github.event.pull_request.head.sha || github.sha }}"
        ' > portal-plugins.yaml
        
        # Add additional dependencies if provided
        if [ -n "${{ inputs.additional_dependencies }}" ]; then
          IFS=',' read -ra DEPS <<< "${{ inputs.additional_dependencies }}"
          INDEX=1
          for dep in "${DEPS[@]}"; do
            dep=$(echo "$dep" | xargs)
            if [ -n "$dep" ]; then
              # Check if dependency has explicit version with @
              if [[ "$dep" == *@* ]]; then
                MODULE="${dep%@*}"
                VERSION="${dep##*@}"
              else
                MODULE="$dep"
                VERSION="latest"
              fi
              yq -i ".plugins[$INDEX].module = \"$MODULE\" | .plugins[$INDEX].version = \"$VERSION\"" portal-plugins.yaml
              INDEX=$((INDEX + 1))
            fi
          done
        fi
        
        # Add replacements if provided
        if [ -n "${{ inputs.replacements }}" ]; then
          IFS=',' read -ra REPS <<< "${{ inputs.replacements }}"
          REP_INDEX=0
          for rep in "${REPS[@]}"; do
            rep=$(echo "$rep" | xargs)
            if [ -n "$rep" ]; then
              OLD="${rep%%=*}"
              NEW="${rep#*=}"
              if [ -n "$OLD" ] && [ -n "$NEW" ]; then
                yq -i ".replacements[$REP_INDEX].old = \"$OLD\" | .replacements[$REP_INDEX].new = \"$NEW\"" portal-plugins.yaml
                REP_INDEX=$((REP_INDEX + 1))
              fi
            fi
          done
        fi
        
        echo "Created portal-plugins.yaml:"
        cat portal-plugins.yaml
    - name: Write Setup Script
      run: |
        cat > /tmp/setup.sh << 'SETUPEOF'
        ${{ inputs.setup_script }}
        SETUPEOF
        chmod +x /tmp/setup.sh
    - name: Setup + Generate + Test + Build
      uses: addnab/docker-run-action@v3
      with:
        image: ghcr.io/lumeweb/portal-builder:ubuntu
        options: -v ${{ github.workspace }}:/workspace -v ${{ github.workspace }}/dist:/dist -v /tmp/setup.sh:/tmp/setup.sh
        shell: bash
        run: |
          set -e
          if [ -s /tmp/setup.sh ]; then
            echo "=== Running setup script ==="
            bash /tmp/setup.sh
            echo "=== Setup complete ==="
          fi
          echo "=== Running go generate ==="
          go generate ./...
          echo "=== Running tests ==="
          go test $(go list ./... | grep -v bench_tests)
          echo "=== Building portal ==="
          build-portal
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: portal-build
        path: dist/portal
        retention-days: 1

  run:
    name: Run Portal (${{ matrix.db_type }})
    needs: build
    strategy:
      matrix:
        db_type: [sqlite, mysql]
    uses: ./.github/workflows/run-portal.yml
    with:
      db_type: ${{ matrix.db_type }}
