name: Build Plugin

on:
  workflow_call:
    inputs:
      additional_dependencies:
        description: 'Additional plugin dependencies to include (comma-separated, format: go.lumeweb.com/plugin-name,go.lumeweb.com/another-plugin)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build Portal
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
          submodules: true
    - name: Extract Repo Name
      id: repo-name
      run: echo "REPO_NAME=$(echo ${{ github.repository }} | cut -d '/' -f 2)" >> $GITHUB_OUTPUT
    - name: Create Plugin Manifest
      run: |
        # Initialize manifest with portal version and current plugin
        yq -n '
          .portalVersion = "develop" |
          .plugins[0].module = "go.lumeweb.com/${{ steps.repo-name.outputs.REPO_NAME }}" |
          .plugins[0].version = "${{ github.sha }}"
        ' > portal-plugins.yaml
        
        # Add additional dependencies if provided
        if [ -n "${{ inputs.additional_dependencies }}" ]; then
          IFS=',' read -ra DEPS <<< "${{ inputs.additional_dependencies }}"
          INDEX=1
          for dep in "${DEPS[@]}"; do
            dep=$(echo "$dep" | xargs)
            if [ -n "$dep" ]; then
              # Check if dependency has explicit version with @
              if [[ "$dep" == *@* ]]; then
                MODULE="${dep%@*}"
                VERSION="${dep##*@}"
              else
                MODULE="$dep"
                VERSION="latest"
              fi
              yq -i ".plugins[$INDEX].module = \"$MODULE\" | .plugins[$INDEX].version = \"$VERSION\"" portal-plugins.yaml
              INDEX=$((INDEX + 1))
            fi
          done
        fi
        
        echo "Created portal-plugins.yaml:"
        cat portal-plugins.yaml
    - name: Build Portal
      uses: addnab/docker-run-action@v3
      with:
        image: ghcr.io/lumeweb/portal-builder:ubuntu
        options: -v ${{ github.workspace }}:/workspace -v ${{ github.workspace }}/dist:/dist
        run: build-portal
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: portal-build
        path: dist/portal
        retention-days: 1

  run:
    name: Run Portal (${{ matrix.db_type }})
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: percona/percona-server:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: portal
          MYSQL_USER: portal
          MYSQL_PASSWORD: portal
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      matrix:
        db_type: [sqlite, mysql]
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
          submodules: true
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: portal-build
    - name: Checkout Workflows for Config
      uses: actions/checkout@v4
      with:
        repository: LumeWeb/workflows
        path: workflows-config
        sparse-checkout: |
          .github/config
          scripts
    - name: Generate Environment Variables
      run: |
        # Config file locations
        WORKFLOWS_CORE_CONFIG="workflows-config/.github/config/portal-core.yml"
        PLUGIN_CONFIG=".github/portal-config.yml"
        YAML_TO_ENV_SCRIPT="workflows-config/scripts/yaml_to_env.py"
        
        # Create MySQL config if needed
        if [ "${{ matrix.db_type }}" = "mysql" ]; then
          yq -n '
            .core.db.type = "mysql" |
            .core.db.host = "127.0.0.1" |
            .core.db.port = 3306 |
            .core.db.username = "portal" |
            .core.db.password = "portal" |
            .core.db.name = "portal" |
            .core.db.charset = "utf8mb4"
          ' > portal-mysql.yml
        fi
        
        # Merge configs and convert to env vars
        CONFIG_FILES=("$WORKFLOWS_CORE_CONFIG")
        
        # Add MySQL config if it exists
        if [ "${{ matrix.db_type }}" = "mysql" ] && [ -f "portal-mysql.yml" ]; then
          CONFIG_FILES+=("portal-mysql.yml")
        fi
        
        # Add plugin config if it exists
        if [ -f "$PLUGIN_CONFIG" ]; then
          CONFIG_FILES+=("$PLUGIN_CONFIG")
        fi
        
        # Convert YAML to env vars using Python script
        for config_file in "${CONFIG_FILES[@]}"; do
          python3 "$YAML_TO_ENV_SCRIPT" "$config_file" .env
        done
        
        # Source the env file
        set -a
        bash -c '. .env'
        set +a
        
        # Export for subsequent steps
        echo "PORTAL_PORT=${PORTAL_PORT:-8080}" >> "$GITHUB_ENV"
        echo "PORTAL_HOST=${PORTAL_HOST:-localhost}" >> "$GITHUB_ENV"
        
        echo "Environment configured (DB: ${{ matrix.db_type }}):"
        cat .env
    - name: Run Mock Renterd Server
      run: |
        python3 workflows-config/scripts/mock-renterd.py 8081 &
        MOCK_PID=$!
        echo "MOCK_PID=$MOCK_PID" >> "$GITHUB_ENV"
        echo "Mock renterd server started (PID: $MOCK_PID)"
        
        # Wait for mock server to be ready
        sleep 2
    - name: Run Portal
      run: |
        # Run the built portal binary with environment variables
        . .env
        
        # Run portal in background
        ./portal &
        PID=$!
        
        # Wait for port binding
        TIMEOUT=30
        count=0
        while [ $count -lt $TIMEOUT ]; do
          if nc -z localhost "${PORTAL_PORT}" 2>/dev/null; then
            echo "✓ Portal successfully bound to port ${PORTAL_PORT}"
            break
          fi
          sleep 2
          count=$((count + 2))
        done
        
        # Check if we timed out
        if [ $count -ge $TIMEOUT ]; then
          echo "✗ Portal failed to bind to port ${PORTAL_PORT} within ${TIMEOUT}s"
          kill -KILL $PID 2>/dev/null || true
          exit 1
        fi
        
        # Graceful shutdown
        kill -TERM "$PID" 2>/dev/null || true
        kill -TERM "$MOCK_PID" 2>/dev/null || true
        wait $PID
        exit $?
