name: Build Plugin

on:
  workflow_call:
    inputs:
      additional_dependencies:
        description: 'Additional plugin dependencies to include (comma-separated, format: go.lumeweb.com/plugin-name,go.lumeweb.com/another-plugin)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Setup Go
      uses: LumeWeb/workflows/.github/actions/setup-go@develop
      with:
        go_version: 1.26
    - name: Install XPortal
      run: |
        go install go.lumeweb.com/xportal/cmd/xportal@latest
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
          submodules: true
    - name: Extract Repo Name
      id: repo-name
      run: echo "REPO_NAME=$(echo ${{ github.repository }} | cut -d '/' -f 2)" >> $GITHUB_OUTPUT
    - name: Build
      run: |
          PLUGIN=$(readlink -f .)
          WITH_ARGS="--with go.lumeweb.com/${{ steps.repo-name.outputs.REPO_NAME }}"
          
          # Add additional dependencies if provided
          if [ -n "${{ inputs.additional_dependencies }}" ]; then
            IFS=',' read -ra DEPS <<< "${{ inputs.additional_dependencies }}"
            for dep in "${DEPS[@]}"; do
              dep=$(echo "$dep" | xargs)  # Trim whitespace
              if [ -n "$dep" ]; then
                WITH_ARGS="$WITH_ARGS --with $dep"
              fi
            done
          fi
          
          xportal build $WITH_ARGS --replace go.lumeweb.com/${{ steps.repo-name.outputs.REPO_NAME }}=$PLUGIN
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: portal-build
        path: portal
        retention-days: 1

  run:
    name: Run Portal
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Setup Go
      uses: LumeWeb/workflows/.github/actions/setup-go@develop
      with:
        go_version: 1.26
    - name: Install XPortal
      run: |
        go install go.lumeweb.com/xportal/cmd/xportal@latest
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
          submodules: true
    - name: Extract Repo Name
      id: repo-name
      run: echo "REPO_NAME=$(echo ${{ github.repository }} | cut -d '/' -f 2)" >> $GITHUB_OUTPUT
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: portal-build
    - name: Checkout Workflows for Config
      uses: actions/checkout@v4
      with:
        repository: LumeWeb/workflows
        path: workflows-config
        sparse-checkout: |
          .github/config
          scripts
    - name: Generate Environment Variables
      run: |
        # Config file locations
        WORKFLOWS_CORE_CONFIG="workflows-config/.github/config/portal-core.yml"
        PLUGIN_CONFIG=".github/portal-config.yml"
        YAML_TO_ENV_SCRIPT="workflows-config/scripts/yaml_to_env.py"
        
        # Merge configs and convert to env vars
        CONFIG_FILES="$WORKFLOWS_CORE_CONFIG"
        
        # Add plugin config if it exists
        if [ -f "$PLUGIN_CONFIG" ]; then
          CONFIG_FILES="$CONFIG_FILES $PLUGIN_CONFIG"
        fi
        
        # Convert YAML to env vars using Python script
        for config_file in $CONFIG_FILES; do
          python3 "$YAML_TO_ENV_SCRIPT" "$config_file" .env
        done
        
        # Source the env file
        set -a
        bash -c '. .env'
        set +a
        
        # Export for subsequent steps
        echo "PORTAL_PORT=${PORTAL_PORT:-8080}" >> $GITHUB_ENV
        echo "PORTAL_HOST=${PORTAL_HOST:-localhost}" >> $GITHUB_ENV
        
        echo "Environment configured:"
        cat .env
    - name: Run Mock Renterd Server
      run: |
        python3 workflows-config/scripts/mock-renterd.py 8081 &
        MOCK_PID=$!
        echo "MOCK_PID=$MOCK_PID" >> $GITHUB_ENV
        echo "Mock renterd server started (PID: $MOCK_PID)"
        
        # Wait for mock server to be ready
        sleep 2
    - name: Run Portal
      run: |
        # Run the built portal binary with environment variables
        . .env
        
        # Run portal in background
        ./portal &
        PID=$!
        
        # Wait for port binding
        TIMEOUT=30
        count=0
        while [ $count -lt $TIMEOUT ]; do
          if nc -z localhost ${PORTAL_PORT} 2>/dev/null; then
            echo "✓ Portal successfully bound to port ${PORTAL_PORT}"
            break
          fi
          sleep 2
          count=$((count + 2))
        done
        
        # Check if we timed out
        if [ $count -ge $TIMEOUT ]; then
          echo "✗ Portal failed to bind to port ${PORTAL_PORT} within ${TIMEOUT}s"
          kill -KILL $PID 2>/dev/null || true
          exit 1
        fi
        
        # Graceful shutdown
        kill -TERM $PID 2>/dev/null || true
        kill -TERM $MOCK_PID 2>/dev/null || true
        wait $PID
        exit $?
