name: Run Portal

on:
  workflow_call:
    inputs:
      db_type:
        description: 'Database type to use (sqlite or mysql)'
        required: true
        type: string

jobs:
  run:
    name: Run Portal (${{ inputs.db_type }})
    runs-on: ubuntu-latest
    services:
      mysql:
        image: percona/percona-server:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: portal
          MYSQL_USER: portal
          MYSQL_PASSWORD: portal
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
          submodules: true
    - name: Download Build Artifacts
      uses: actions/download-artifact@v8
      with:
        name: portal-build
    - name: Checkout Workflows for Config
      uses: actions/checkout@v7
      with:
        repository: LumeWeb/workflows
        path: workflows-config
        sparse-checkout: |
          .github/config
          scripts
    - name: Generate Environment Variables
      run: |
        # Config file locations
        WORKFLOWS_CORE_CONFIG="workflows-config/.github/config/portal-core.yml"
        PLUGIN_CONFIG=".github/portal-config.yml"
        YAML_TO_ENV_SCRIPT="workflows-config/scripts/yaml_to_env.py"
        
        # Create MySQL config if needed
        if [ "${{ inputs.db_type }}" = "mysql" ]; then
          yq -n '
            .core.db.type = "mysql" |
            .core.db.host = "127.0.0.1" |
            .core.db.port = 3306 |
            .core.db.username = "portal" |
            .core.db.password = "portal" |
            .core.db.name = "portal" |
            .core.db.charset = "utf8mb4"
          ' > portal-mysql.yml
        fi
        
        # Merge configs and convert to env vars
        CONFIG_FILES=("$WORKFLOWS_CORE_CONFIG")
        
        # Add MySQL config if it exists
        if [ "${{ inputs.db_type }}" = "mysql" ] && [ -f "portal-mysql.yml" ]; then
          CONFIG_FILES+=("portal-mysql.yml")
        fi
        
        # Add plugin config if it exists
        if [ -f "$PLUGIN_CONFIG" ]; then
          CONFIG_FILES+=("$PLUGIN_CONFIG")
        fi
        
        # Convert YAML to env vars using Python script
        for config_file in "${CONFIG_FILES[@]}"; do
          python3 "$YAML_TO_ENV_SCRIPT" "$config_file" .env
        done
        
        # Source the env file directly to make variables available
        set -a
        . .env
        set +a
        
        # Export for subsequent steps
        echo "PORTAL_PORT=${PORTAL_PORT:-8080}" >> "$GITHUB_ENV"
        echo "PORTAL_HOST=${PORTAL_HOST:-localhost}" >> "$GITHUB_ENV"
        
        echo "Environment configured (DB: ${{ inputs.db_type }}):"
        cat .env
    - name: Run Mock Renterd Server
      run: |
        python3 workflows-config/scripts/mock-renterd.py 8081 &
        MOCK_PID=$!
        echo "MOCK_PID=$MOCK_PID" >> "$GITHUB_ENV"
        echo "Mock renterd server started (PID: $MOCK_PID)"
        
        # Wait for mock server to be ready
        sleep 2
    - name: Run Portal
      run: |
        # Make portal executable
        chmod +x ./portal
        
        # Run the built portal binary with environment variables
        . .env
        
        # Run portal in background
        ./portal &
        PID=$!
        
        # Wait for port binding
        TIMEOUT=30
        count=0
        while [ $count -lt $TIMEOUT ]; do
          if nc -z localhost "${PORTAL_PORT}" 2>/dev/null; then
            echo "✓ Portal successfully bound to port ${PORTAL_PORT}"
            break
          fi
          sleep 2
          count=$((count + 2))
        done
        
        # Check if we timed out
        if [ $count -ge $TIMEOUT ]; then
          echo "✗ Portal failed to bind to port ${PORTAL_PORT} within ${TIMEOUT}s"
          kill -KILL $PID 2>/dev/null || true
          exit 1
        fi
        
        # Graceful shutdown
        kill -TERM "$PID" 2>/dev/null || true
        kill -TERM "$MOCK_PID" 2>/dev/null || true
        wait $PID
        exit $?
