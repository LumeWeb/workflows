# Minimal Portal Configuration for CI Testing

core:
  domain: "localhost"
  portal_name: "test-portal"
  port: 8080
  secure: false
  post_upload_limit: 104857600

core.db:
  type: "sqlite"
  file: "portal.db"

core.log:
  level: "debug"

core.mail:
  host: "localhost"
  port: 25
  ssl: false
  auth_type: "none"
  username: "test"
  password: "test"
  from: "test@localhost"

core.storage.sia:
  url: "http://localhost:8081/"
  key: "0"
