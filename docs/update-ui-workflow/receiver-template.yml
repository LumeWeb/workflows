# Receiver Workflow Template
# Copy this file to .github/workflows/update-ui.yml in your repository

name: Handle UI Update

on:
  repository_dispatch:
    types: [update-ui]

jobs:
  call-workflow:
    uses: LumeWeb/workflows/.github/workflows/update-ui.yml@main
    with:
      commit_hash: ${{ github.event.client_payload.commit_hash }}
      app_name: ${{ github.event.client_payload.app_name }}
      repository: ${{ github.event.client_payload.repository }}
    secrets:
      PAT: ${{ secrets.PAT }}
